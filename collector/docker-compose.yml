services:
  collector:
    build: .
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}      # es. https://meteo.tuodominio.it
      - WU_API_KEY=${WU_API_KEY}
      - WU_STATION_ID=IPRIMI4
      - CACHE_SECONDS=180
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 60s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - collector
    restart: unless-stopped
