name: Pubblica su hosting FTP

# Si avvia a ogni modifica di main (anche da Lovable) o a mano da "Actions" → "Run workflow".
# Richiede le credenziali FTP nei Secrets (vedi sotto). Se mancano, non fa niente.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Leggi le credenziali FTP
        id: check
        env:
          # Accetta o un solo segreto FTP_ACCESS con righe "FTP_HOST: ...", "FTP_USER: ...", "FTP_PASS: ...",
          # oppure tre segreti separati FTP_HOST, FTP_USER, FTP_PASS.
          ACCESS: ${{ secrets.FTP_ACCESS }}
          S_HOST: ${{ secrets.FTP_HOST }}
          S_USER: ${{ secrets.FTP_USER }}
          S_PASS: ${{ secrets.FTP_PASS }}
          S_DIR: ${{ secrets.FTP_DIR }}
        run: |
          get() { printf '%s\n' "$ACCESS" | tr -d '\r' | sed -n "s/^[[:space:]]*$1[[:space:]]*[:=][[:space:]]*//p" | head -1 | sed 's/[[:space:]]*$//'; }
          HOST="${S_HOST:-$(get FTP_HOST)}"
          USER_="${S_USER:-$(get FTP_USER)}"
          PASS_="${S_PASS:-$(get FTP_PASS)}"
          DIR_="${S_DIR:-$(get FTP_DIR)}"
          [ -z "$DIR_" ] && DIR_="/htdocs/"
          if [ -z "$HOST" ] || [ -z "$USER_" ] || [ -z "$PASS_" ]; then
            echo "Credenziali FTP incomplete (host/utente/password): salto la pubblicazione."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$PASS_"
            echo "::add-mask::$USER_"
            { echo "FTP_H=$HOST"; echo "FTP_U=$USER_"; echo "FTP_P=$PASS_"; echo "FTP_D=$DIR_"; } >> "$GITHUB_ENV"
            echo "Credenziali trovate per il server $HOST, cartella $DIR_"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.ready == 'true'

      - name: Compila il sito
        if: steps.check.outputs.ready == 'true'
        env:
          VITE_API_URL: /weather.php
        run: |
          bun install
          bun run build
          cp hosting/weather.php dist/weather.php

      - name: Carica via FTP
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_H }}
          username: ${{ env.FTP_U }}
          password: ${{ env.FTP_P }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: ${{ env.FTP_D }}
